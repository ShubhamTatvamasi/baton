[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baton"
version = "0.1.0"
description = "Plan-driven session supervisor for OpenCode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
baton = "baton.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Typer's API requires function calls in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
